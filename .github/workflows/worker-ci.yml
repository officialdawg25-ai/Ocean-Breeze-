name: Ocean Breeze Worker QA
on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Run experience and security smoke tests
        run: node --test tests/worker.test.mjs
